name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege at workflow scope, granted per job below. Previously both
# contents:write and id-token:write applied to every job, so the build job -
# which resolves hatchling and its whole transitive tree fresh from PyPI with
# no pins - held a push-capable token AND could mint a PyPI OIDC token from
# outside the protected `pypi` environment.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, so do not leave a credential in
          # .git/config for the dependency tree to find.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The artefact must be one the publish step can actually accept
        # v0.3.1 built green and died at the upload, after the GitHub Release
        # had already been created - leaving a tag whose action.yml required a
        # `ward-scanner` version PyPI did not have. The failure belongs here,
        # where it costs a re-tag and nothing else.
        #
        # `twine check` alone would NOT have caught it: the twine resolved
        # here is current and accepts 2.5 quite happily. What matters is the
        # twine inside pypa/gh-action-pypi-publish, which is older. So assert
        # the metadata version explicitly and keep the two coupled on purpose.
        # When the publish action ships a newer twine, raise both this and the
        # hatchling bound in pyproject.toml together.
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check dist/*
          metadata=$(python - <<'PY'
          import glob, re, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              text = z.read(name).decode("utf-8", "replace")
          print(re.search(r"^Metadata-Version:\s*(\S+)", text, re.M).group(1))
          PY
          )
          echo "Metadata-Version: ${metadata}"
          case "${metadata}" in
            2.1|2.2|2.3|2.4) ;;
            *)
              echo "::error::Built Metadata-Version ${metadata}, which the publish action's twine will reject. Pin hatchling lower in pyproject.toml, or raise this guard once the action ships a newer twine."
              exit 1
              ;;
          esac

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    # Only runs once you've set the repo variable PYPI_READY=true AND
    # configured a trusted publisher at https://pypi.org for this repo.
    # Until then this job is skipped so tag pushes don't fail the workflow.
    if: vars.PYPI_READY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Only the trusted-publisher exchange. No repo write of any kind.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ward-scanner
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the release needs contents:write, and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
