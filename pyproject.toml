[build-system]
# PINNED, and the upper bound is load-bearing.
#
# The release job installs `build` and lets it resolve this fresh from PyPI on
# every run, so the artefact depended on whatever was published that day.
# hatchling 1.32.0 started emitting `Metadata-Version: 2.5`, and the twine
# inside the pinned pypa/gh-action-pypi-publish rejects it:
#
#   InvalidDistribution: Invalid distribution metadata: '2.5' is not a valid
#   metadata version
#
# v0.3.1 built green, produced a GitHub Release, and failed at the upload -
# leaving a tag whose action.yml required `ward-scanner>=0.3.1` from a PyPI
# that did not have it. Nothing was wrong with the code; the build was simply
# not reproducible, which for a security tool is its own defect.
#
# 2.5 is a perfectly valid metadata version. The constraint is twine's, not
# ours, so raise this bound once the publish action ships a twine that accepts
# it - the guard in .github/workflows/release.yml will say so.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "ward-scanner"
version = "0.3.2"
description = "Pre-agent metadata scanner. Catches prompt injection in branch names, commits, PR titles, and other inputs before they reach an AI code reviewer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Craig McCart" }]
keywords = [
  "security",
  "prompt-injection",
  "ai-security",
  "appsec",
  "devsecops",
  "owasp-asi",
  "sast",
  "github-action",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]
# pydantic was declared here but imported nowhere. Every `pip install
# ward-scanner` - including the composite action and every pre-commit hook
# environment - pulled pydantic plus the pydantic-core Rust extension into a
# CI runner for code that never used them. That is precisely the supply-chain
# exposure Ward exists to reduce, so it is gone. Keep this list minimal.

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
bench-download = [
  # Only needed for downloading the parquet-formatted upstream corpora
  # (Lakera, deepset). The CSV / JSONL corpora work without this extra.
  "pyarrow>=15.0",
]
judge = [
  # Only needed for the optional LLM judge tier (`ward judge --engine anthropic`
  # and `ward bench --judge anthropic`). Ward's core is regex-only and has no
  # LLM dependency.
  #
  # 0.77 is the first release whose Messages.create accepts `output_config`,
  # which anthropic_judge.py requires for structured outputs. Verified by
  # inspecting the create() signature in each wheel, not assumed: 0.76 does
  # not have it. The floor used to be 0.40, so an environment that already
  # had any 0.4x-0.7x satisfied the constraint, pip declined to upgrade, and
  # every judge call died with an unexpected-keyword TypeError.
  "anthropic>=0.77",
]

[project.scripts]
ward = "ward.cli:app"

[project.urls]
Homepage = "https://github.com/craigmccart/ward"
Issues = "https://github.com/craigmccart/ward/issues"
Source = "https://github.com/craigmccart/ward"

[tool.hatch.build.targets.wheel]
packages = ["src/ward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ward"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: line length is handled by formatter, not the linter.
# UP042: `class Foo(str, Enum)` is intentional - converting to `StrEnum` changes
#        `str()` output semantics and we lean on the (str, Enum) form deliberately.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Ward's whole purpose is detecting Cyrillic / Latin homoglyphs. Source code
# that exercises those code points cannot be made "non-ambiguous" without
# defeating the test or demo.
"src/ward/demo.py" = ["RUF001", "RUF002", "RUF003"]
"src/ward/selftest.py" = ["RUF001", "RUF002", "RUF003"]
"src/ward/detectors/obfuscation.py" = ["RUF001", "RUF002", "RUF003"]
"src/ward/detectors/base.py" = ["RUF001", "RUF002", "RUF003"]
"src/ward/cli.py" = ["RUF001", "RUF002", "RUF003"]
"src/ward/core/normalise.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_detectors.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_fail_closed.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_lab.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_normalise.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_encoding_bypasses.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_derived_form_parity.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_incomplete_checks_are_not_passes.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_multilingual_coverage.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_dependabot_is_not_an_attacker.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ward"]

# pyarrow is an optional runtime dep (only needed for `ward bench --download`
# against parquet corpora). It's not in the [dev] extra so mypy on CI cannot
# see it. Allow the missing import so both environments pass.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

# anthropic is an optional runtime dep (only the LLM judge tier needs it) and
# is not in the [dev] extra, so mypy on CI cannot see it. Allow the missing
# import so both environments pass.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true
