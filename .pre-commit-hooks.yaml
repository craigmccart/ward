# Pre-commit framework hooks for Ward.
# Consumers add a block like this to their own .pre-commit-config.yaml:
#
#   - repo: https://github.com/craigmccart/ward
#     rev: v0.3.2
#     hooks:
#       - id: ward-scan-local
#         args: [--fail-on, high]

- id: ward-scan-local
  name: Ward scan-local
  description: |
    Scan the current branch name, the most recent commit messages, tag
    names, every tracked file path, and the top of every Markdown / text
    / source file for prompt-injection patterns.
  entry: ward scan-local
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]

- id: ward-scan-stdin
  name: Ward scan-stdin (commit message)
  description: |
    Pipe the commit message under composition through Ward. Designed for
    use with `stages: [commit-msg]`.
  # The trailing `--` fills bash's $0 slot, so the filename pre-commit appends
  # lands in $1. Without it the name goes to $0, `$1` is empty, ward reads an
  # empty stdin and exits 0 - the hook silently passes every commit message,
  # including a critical payload. An unreadable file is a hard error for the
  # same reason: a gate that cannot read its input must not report success.
  entry: bash -c 'test -r "$1" || { echo "ward cannot read the commit-message file" >&2; exit 2; }; ward scan-stdin --surface commit_message --fail-on high < "$1"' --
  language: python
  pass_filenames: true
  stages: [commit-msg]

- id: ward-selftest
  name: Ward selftest
  description: Run the built-in adversarial scenarios. Useful as a CI gate.
  entry: ward selftest
  language: python
  pass_filenames: false
  always_run: true
  stages: [manual]
